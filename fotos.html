    <!-- Script de paginación: muestra solo el carrusel solicitado, con fade suave -->
    <script>
      function showCarousel(hash) {
        const containers = document.querySelectorAll('.container');

        containers.forEach(c => {
          c.classList.remove('active', 'show');
        });

        const targetEl = hash ? document.querySelector(hash) : null;
        const toShow = (targetEl ? targetEl.closest('.container') : null) || containers[0];

        toShow.classList.add('active');

        requestAnimationFrame(() => {
          setTimeout(() => toShow.classList.add('show'), 30);
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        showCarousel(window.location.hash);
      });

      window.addEventListener('hashchange', () => {
        showCarousel(window.location.hash);
      });
    </script>
